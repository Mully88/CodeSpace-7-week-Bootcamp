<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rock Paper Scissors</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

  <div class="container text-center mt-5">
    <h1 class="mb-4">Rock Paper Scissors</h1>

    <div class="btn-group mb-4">
      <button class="btn btn-primary choice-btn" data-choice="rock">Rock</button>
      <button class="btn btn-success choice-btn" data-choice="paper">Paper</button>
      <button class="btn btn-danger choice-btn" data-choice="scissors">Scissors</button>
    </div>

    <div class="mt-4">
      <h4 id="result-text" class="fw-bold"></h4>
      <p id="score-text">Player: 0 | Computer: 0</p>
    </div>

    <button id="reset-btn" class="btn btn-secondary mt-3">Reset</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
